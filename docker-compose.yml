name: tavoro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      # Published on localhost only, so `npm run dev` on the same machine can use it
      # but nothing else on the network can reach the database.
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # MinIO stopped publishing images to Docker Hub/Quay (minio/minio no longer pulls),
    # so use Chainguard's build. It runs as uid 65532, not root: a miniodata volume
    # created by the old image needs a one-time `chown -R 65532:65532` on its data.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      # Localhost only, for local development (`npm run dev` talks to MinIO on
      # localhost:9000). Browsers never use it — all file traffic streams through the
      # app — so it isn't reachable from the network.
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console

  # One-shot: apply migrations then seed the first admin, then exit.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@tavoro.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme123}
      SEED_WORKSPACE_NAME: ${SEED_WORKSPACE_NAME:-Demo Workspace}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: app
      args:
        # The commit being deployed (set by deploy/update-agent.sh before it builds).
        # Lets Next.js's version-skew protection force a full reload for tabs still
        # running a previous deploy's JS instead of leaving client navigation broken.
        DEPLOYMENT_ID: ${DEPLOYMENT_ID:-dev}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-tavoro}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # SMTP: the worker sends queued notifications; the app also reads these so the
      # admin "Send test email" (Settings → Notifications) can send synchronously.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-Tavoro <no-reply@haggabasin.com>}"
      # Self-service signup (new workspaces) is off once the first account exists, unless "true".
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      # Who may update the server (Settings → Updates); default: admins of the oldest workspace.
      INSTANCE_ADMIN_EMAILS: ${INSTANCE_ADMIN_EMAILS:-}
      APP_URL: ${APP_URL:-}
      # Old hostnames whose page visits redirect to APP_URL (comma-separated, optional).
      LEGACY_HOSTS: ${LEGACY_HOSTS:-}
      # Shared with the host self-update agent (see deploy/update-agent.sh). The app
      # only reads status + drops request files here; the host agent does the work.
      UPDATE_CONTROL_DIR: /app/update-control
    volumes:
      - ./update-control:/app/update-control
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # The worker sends queued email notifications (the app enqueues via Redis and
      # also reads SMTP for the admin "Send test email").
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-Tavoro <no-reply@haggabasin.com>}"
      APP_URL: ${APP_URL:-}
      # Guest review links are HMACs keyed by this — reminder emails re-create them.
      SESSION_SECRET: ${SESSION_SECRET}
      # The nightly review-file sweep deletes unused uploads from MinIO.
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-tavoro}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
